name: fedgcn-aml-gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.4.3
  - pandas=3.0.2
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - pytest=9.0.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torch-geometric==2.7.0
      - tenseal==0.3.16
